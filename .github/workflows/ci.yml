name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: imobflow, POSTGRES_PASSWORD: imobflow_dev, POSTGRES_DB: imobflow_test }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U imobflow" --health-interval 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://imobflow:imobflow_dev@127.0.0.1:5432/imobflow_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm test
      - run: npm run build
